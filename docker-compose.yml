services:
  db:
    image: postgres:16-alpine
    container_name: refs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refspass}
      POSTGRES_DB: ${POSTGRES_DB:-refs}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refs} -d ${POSTGRES_DB:-refs}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Если доступ к БД с хоста не нужен — закомментируйте эти две строки.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build: ./backend
    container_name: refs-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-refs}:${POSTGRES_PASSWORD:-refspass}@db:5432/${POSTGRES_DB:-refs}
    # Бэкенд доступен только внутри сети compose; наружу его отдаёт nginx.
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: refs-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  pgdata:
